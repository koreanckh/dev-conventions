# Codex 프로젝트 기본값 — 대상 repo `.codex/config.toml`로 복사(커밋).
# `.codex/` 안의 파일은 개발자가 이 프로젝트를 한 번 trust한 뒤에만 로드된다.
# 우선순위: CLI 플래그 > --profile > .codex/config.toml(이 파일) > ~/.codex/config.toml > /etc/codex/config.toml > 기본값
# 출처: dev-conventions/templates/harness (→ docs/conventions/harness-engineering.md)

# 언제 묻는가. untrusted | on-request | on-failure | never
approval_policy = "on-request"

# 무엇을 기술적으로 할 수 있는가. read-only | workspace-write | danger-full-access
# danger-full-access는 컨테이너 등 프로세스 밖 경계가 있을 때만.
sandbox_mode = "workspace-write"

# 역할별 프로필 예시. `codex --profile ci exec "..."`처럼 호출. 필요할 때 주석을 풀어 쓴다.
# [profiles.ci]
# approval_policy = "never"
# sandbox_mode = "read-only"
#
# [profiles.deep-review]
# model_reasoning_effort = "xhigh"
# approval_policy = "on-request"
