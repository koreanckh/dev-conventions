# Codex 전역 기본값 — `bootstrap.sh`가 `${CODEX_HOME:-~/.codex}/config.toml`에 **키 단위로 병합**한다.
# 여기 없는 키(모델·프로필·MCP 등 머신 고유 값)는 건드리지 않는다.
# 우선순위: CLI 플래그 > --profile > 프로젝트 .codex/config.toml > 이 파일(~/.codex/config.toml) > /etc/codex/config.toml > 기본값
# 원본: dev-conventions/global/enforcement/codex (→ global/skills/harness-engineering/SKILL.md)
#
# 프로젝트가 `.codex/`로 더 강한 값을 요구하면 그쪽이 이긴다. 단 Codex는 프로젝트를 한 번 trust한 뒤에만
# `.codex/` 안의 것을 로드한다 — 새 PC에서 프로젝트 hook이 안 돌면 trust부터 확인한다.

# 언제 묻는가. untrusted | on-request | on-failure | never
approval_policy = "on-request"

# 무엇을 기술적으로 할 수 있는가. read-only | workspace-write | danger-full-access
# danger-full-access는 컨테이너 등 프로세스 밖 경계가 있을 때만.
sandbox_mode = "workspace-write"

# 역할별 프로필 예시. `codex --profile ci exec "..."`처럼 호출. 필요할 때 주석을 풀어 쓴다.
# [profiles.ci]
# approval_policy = "never"
# sandbox_mode = "read-only"
#
# [profiles.deep-review]
# model_reasoning_effort = "xhigh"
# approval_policy = "on-request"
